<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPECTRA Equity</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1115;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(520px,100%);margin:0 auto;padding:24px 16px}
  h1{font-size:22px;margin:0 0 20px}
  label{display:block;font-size:13px;color:#aaa;margin:14px 0 6px}
  input{width:100%;padding:12px;border:1px solid #333;border-radius:8px;background:#191c22;color:#fff;font-size:16px}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:700;font-size:16px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  #result{margin-top:28px;text-align:center}
  #win{font-size:64px;font-weight:800;line-height:1}
  #status{margin-top:12px;color:#999;font-size:13px;min-height:20px}
  .hint{margin-top:18px;color:#777;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>SPECTRA Equity</h1>

  <label for="hero">Hero</label>
  <input id="hero" placeholder="As Kd" autocomplete="off">

  <label for="board">Board（3〜5枚）</label>
  <input id="board" placeholder="Ah 7c 2s" autocomplete="off">

  <button id="calc">勝率を計算</button>

  <section id="result" hidden>
    <div id="win">--%</div>
    <div id="status"></div>
  </section>

  <div class="hint">
    相手のハンドを指定しない場合、Hero / Board と衝突しない全2枚コンボを均等に相手レンジとして使用します。
    FlopはMonte Carlo推計、Turn/Riverは完全列挙です。
  </div>
</main>

<script src="./core/utils.js"></script>
<script src="./core/strength.js"></script>
<script src="./core/equity.js"></script>
<script>
const $ = id => document.getElementById(id);

function parseCards(text) {
  return text.trim().split(/\s+/).filter(Boolean);
}

function validateCards(cards, expected, name) {
  if (cards.length !== expected) throw new Error(name + "は" + expected + "枚必要です");
  if (cards.some(c => !/^[AKQJT98765432][shdc]$/.test(c))) {
    throw new Error("カード表記は As / Kd / 7c の形式で入力してください");
  }
  if (new Set(cards).size !== cards.length) throw new Error("同じカードが重複しています");
}

$("calc").addEventListener("click", () => {
  const button = $("calc");
  const result = $("result");
  const win = $("win");
  const status = $("status");

  try {
    const hero = parseCards($("hero").value);
    const board = parseCards($("board").value);
    validateCards(hero, 2, "Hero");
    if (board.length < 3 || board.length > 5) throw new Error("Boardは3〜5枚で入力してください");
    validateCards(board, board.length, "Board");
    if (new Set([...hero, ...board]).size !== 2 + board.length) {
      throw new Error("HeroとBoardで同じカードが使われています");
    }

    button.disabled = true;
    status.textContent = "計算中…";
    result.hidden = false;

    setTimeout(() => {
      try {
        const r = computeEquity({hero, board});
        win.textContent = (r.winProbability * 100).toFixed(1) + "%";
        status.textContent = r.precise ? "完全列挙" : "Monte Carlo 50,000試行";
      } catch (e) {
        win.textContent = "--%";
        status.textContent = e.message;
      } finally {
        button.disabled = false;
      }
    }, 20);
  } catch (e) {
    result.hidden = false;
    win.textContent = "--%";
    status.textContent = e.message;
  }
});
</script>
</body>
</html>
